      /* ========================================================
         SINGLE SOURCE OF TRUTH for global CSS.
         Everything here loads before first paint, so hover
         classes, keyframes, and the reset are available on
         every screen (splash, difficulty, game) with no
         JS-injected styles and no per-component <style> tags.

         Color values are declared ONCE below, as CSS custom
         properties, and must match src/styles/theme.js's DS
         object exactly — that's the JS-side source of truth,
         this is the CSS-side source of truth. Two files, not
         four: plain CSS here can't import a JS module and still
         be ready before first paint, so this block is the whole
         reason a second declaration exists. Every rule after it
         uses var()/color-mix() instead of repeating a hex value.
         ======================================================== */
      :root {
        --voltage: #A3D85A;
        --slate: #A7B0A1;
        --dusk: #141F19;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* The game fits the viewport, always — see src/ui/viewport.jsx.
         So the document itself never scrolls, and saying so here is
         what stops an iOS rubber-band bounce from making a fitted
         screen feel like a broken one. */
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { background: var(--dusk); }
      #root { height: 100%; }

      /* 100dvh where it exists, 100vh where it does not. Two
         declarations of the same property is the only way to write
         that fallback, which a React inline style object cannot do
         — hence a class. dvh matters on phones specifically: with
         vh, the layout is sized for a URL bar that has already
         scrolled away, and the bottom of the table goes with it. */
      .app-vh { height: 100vh; height: 100dvh; }
      .app-min-vh { min-height: 100vh; min-height: 100dvh; }

      /* No 300ms tap delay, no double-tap zoom on a control. Cards
         carry role=button, so they are covered too. Pinch zoom on
         the page is deliberately left alone. */
      button, [role="button"] { touch-action: manipulation; }
      /* No grey/black flash on a tap. Touch browsers paint a
         -webkit-tap-highlight-color rectangle over anything tappable,
         and a card is a [role=button] whose real outline is a
         clip-path — so the highlight drew the RECTANGLE the card has
         stopped being, as a dark blink a frame before the card lifted.
         Desktop never had it, which is the whole reason toggling a
         card felt unbroken under a mouse and chipped under a thumb
         (Stan, 2026-09-15). Inherited, so declaring it on the root
         covers every control on every screen. */
      html { -webkit-tap-highlight-color: transparent; }
      /* Wider, higher-contrast scrollbar than the original 5px/27% —
         a clipped/overflowing panel needs a visible cue that more
         content is reachable, not just a hidden native scrollbar. */
      * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--slate) 55%, transparent) transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--slate) 55%, transparent); border-radius: 4px; }

      /* Keyboard focus. Every button in this project set
         `outline:'none'` with no replacement, so a keyboard user had no
         idea where they were. :focus-visible (not :focus) means a mouse
         click never paints a ring — only keyboard navigation does, which
         is why the outline can be this loud without ever being in a
         mouse user's way. Voltage is already the "interactive/yours"
         token, so the ring says the same thing as everything else. */
      :focus-visible {
        outline: 3px solid var(--voltage);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* Available to a screen reader, absent from the picture. Used for
         the per-screen <h1>s and for the two live regions that narrate
         the game — see GameAnnouncer in hud.jsx. `clip-path` rather than
         `display:none` or `visibility:hidden`, because both of those
         remove the node from the accessibility tree as well, which would
         defeat the entire point of a live region. */
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* The wordmark is the page's <h1>. Reset what a UA gives an h1 so
         the heading is a semantic change and not a visual one. */
      h1.scraps-title { margin: 0; font-size: inherit; font-weight: inherit; }

      /* `.menu-opt` and `.diff-opt` lived here until 2026-08-27. Both were
         dead: the splash's option wall was deleted with the RULES panel,
         and the difficulty picker became a real <button> styled by
         `.pick-box` below. Nothing in src/ referenced either class. */

      /* Difficulty picker — the two big boxes. They unfold from a
         hairline and are INERT until .armed lands (see ARM_MS in
         MenuScreens.jsx): pointer-events off, muted border, so a
         click-streak carried over from the storyboard can't pick a
         difficulty by accident. .armed is the visual "now listening"
         cue — border snaps to voltage and the box pulses once. */
      .pick-box {
        /* A real <button> now, not a div, so the UA's own font, colour,
           centring and width have to be unset for the panel to look
           exactly as it did. */
        min-height: 44px;
        appearance: none;
        -webkit-appearance: none;
        font: inherit;
        color: inherit;
        text-align: left;
        width: 100%;
        display: block;
        position: relative;
        border: 2px solid color-mix(in srgb, var(--slate) 27%, transparent);
        border-radius: 14px;
        padding: 26px 30px;
        background: color-mix(in srgb, var(--dusk) 90%, var(--slate));
        cursor: default;
        pointer-events: none;
        animation: panelDeal 620ms cubic-bezier(.2,.9,.3,1) backwards;
        transition: border-color 140ms, background 140ms, box-shadow 140ms, transform 140ms;
      }
      /* THE HARD-BOX JUT (Stan, 2026-09-14: "the HARD button still
         glitches a little after animating — a one-time fluke where it
         juts to the left of the screen and quickly repositions").
         `.armed` used to re-declare the `animation` shorthand on the
         box itself, adding armFlash beside panelDeal. EASY's deal-in
         (delay 0) has finished by the time the 720ms arm lands; HARD's
         (delay 150ms, so 150-770ms) is STILL RUNNING, and rewriting a
         running element's animation list is exactly the kind of change
         a browser may answer by restarting the animation from its first
         frame — which for panelDeal is translate(-46%,-24%): the box
         jumps to the left and deals itself in again. Only HARD, only
         once, and not on every browser, which is why it read as a fluke.
         The flash lives on a pseudo-element now, so the box's own list
         is written once and never touched again. */
      .pick-box::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 14px;
        pointer-events: none;
      }
      .pick-box.armed {
        cursor: pointer;
        pointer-events: auto;
        border-color: color-mix(in srgb, var(--accent, var(--voltage)) 70%, transparent);
      }
      .pick-box.armed::after {
        animation: armFlash 620ms ease-out;
      }
      /* --accent is set per box from theme.js (voltage for EASY, ember
         for HARD) so the two options differ by more than their words.
         Falls back to voltage, which is what every other .pick-box in
         the project would want. */
      @media (hover: hover) and (pointer: fine) {
        .pick-box.armed:hover {
          border-color: var(--accent, var(--voltage));
          background: color-mix(in srgb, var(--accent, var(--voltage)) 10%, transparent);

         the exact box the redesign removed.

         contents are the cards, it traces their real torn outlines and
         the gaps between them. `--glow` is set inline per pile, since

         heap, so it overshoots in rotation and bounces a few pixels —
         deliberately unlike the displaced cards it lands among, which
         slide sideways on a long non-springy curve with no rotation at
         all (the `left` transition in HorizontalScrapsZone). Two
         motions overlap every time a card lands and the whole point is
         that they do not look alike: one is thrown, the others are
         tidied. */
      @keyframes scrapSettle{

         identical resting frame with no travel. Declared here and
         overridden inside the reduced-motion block below. */
      @keyframes scrapArrive{from{opacity:0}to{opacity:1}}

         hand, the score rolling up, the sweep out of a round, the
         letter cards of the match screen, the ROUND N sign — runs on
         the keyframes below. Each ENTRANCE ENDS ON THE ELEMENT'S
         RESTING STYLE, deliberately: a tap mid-choreography re-runs

      @keyframes scoreWave{0%,100%{transform:translateY(0) rotate(0deg);text-shadow:0 0 0 rgba(0,0,0,0)}12%{transform:translateY(-12px) rotate(-2deg);text-shadow:0 6px 6px rgba(0,0,0,.4)}26%{transform:translateY(0) rotate(0deg);text-shadow:0 0 0 rgba(0,0,0,0)}}

      @keyframes scoreJump{0%{transform:translateY(0) scale(1) rotate(0deg)}20%{transform:translateY(-22px) scale(1.18) rotate(-3deg)}34%{transform:translateY(-16px) scale(1.16) rotate(3deg)}48%{transform:translateY(-18px) scale(1.16) rotate(-2deg)}62%{transform:translateY(-14px) scale(1.14) rotate(2deg)}100%{transform:translateY(0) scale(1) rotate(0deg)}}

      @keyframes scrapTension{0%{transform:translate(0,0);filter:brightness(1)}15%{transform:translate(-.8px,.5px)}30%{transform:translate(1.3px,-.9px)}45%{transform:translate(-1.9px,1.3px)}60%{transform:translate(2.5px,-1.6px)}72%{transform:translate(-3.2px,2px)}84%{transform:translate(3.8px,-2.3px)}92%{transform:translate(-4.3px,2.5px)}100%{transform:translate(0,0);filter:brightness(1.22)}}

      @keyframes cardWiggle{0%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(4deg) scale(1.06)}}

         hand jumping around rather than as a hand being riffled. */
      /* Her cards while she thinks (2026-09-17, replacing cardRuffle): each

      @keyframes cardEdgeFlip{0%,100%{transform:rotateY(0deg) translateY(0)}50%{transform:rotateY(78deg) translateY(-8px)}}

      @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
      @keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

         detector's bounce-easing finding, restated in game terms.

      @keyframes errRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

         reads as the option becoming available rather than as a new

         the tag is still there, it simply does not travel. */
      @keyframes aceTagIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
      /* The narrator arriving once the cards are down (Stan, 2026-09-16).

         buttons follow it a beat later (narratorCopyIn, 140ms behind).

      @keyframes narratorIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

        82.4%{transform:translate(3.3px,-.5px) rotate(1.2deg) scale(1.054)}

        91.4%{transform:translate(3.7px,-.5px) rotate(1.4deg) scale(1.064)}
        95.9%{transform:translate(-3.9px,.5px) rotate(-1.5deg) scale(1.068)}
        100% {transform:translate(0,0) rotate(0deg) scale(1.07);background-color:var(--charge-2);box-shadow:0 0 36px var(--charge-2),0 0 80px var(--charge-glow-1)}

      /* The treeline sway lived here until 2026-09-01, and the four-suit
         riffle on the splash until 2026-09-13. Both belonged to things
         that no longer render — `RidgeBackdrop` when Stan cut the
         product to two backgrounds, and the suit row when suits left

         sitting here unused. Recoverable from git at ef34063 and at

      /* ========================================================
         SCRAPS wordmark — letter cards since 2026-09-17 (Stan's pick
         off The Turnover; it was six Rye letters that riffled). Four
         nested layers per card, because four separate things want to
         own `transform` at once and the last animation to run would
         otherwise win:
           .scraps-letter   the entrance (letterAppear)
           .scraps-kinetic  the desktop hover fan (transition only)
           .wm-wave         the gentle wave: a slow bob travelling the
                            row, each card a beat behind the last
           .wm-cycle        the ripple: every 2.6s each card flips over
                            and straight back, in a wave; most of the
                            cycle is stillness, like the old riffle
         The perspective sits on .wm-wave, the ripple's parent, so the
         flip turns in 3D; .wm-face is a card face and .wm-back its
         dusk back, turned away until the ripple brings it round.
         ======================================================== */
      .scraps-title {
        display: flex;
        justify-content: center;
        /* The wordmark answers hover, but clicking it does nothing on
           a pointer device, so it must not claim to be a control.
           Cursor stays default deliberately. */
        cursor: default;

      .scraps-kinetic {

      .wm-wave, .wm-cycle { display: block; position: relative; width: 100%; height: 100%; }

      .wm-cycle { transform-style: preserve-3d; }
      .wm-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .wm-back { transform: rotateY(180deg); }
      @keyframes wmWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
      @keyframes wmCycle{0%,70%,100%{transform:rotateY(0deg) translateY(0)}80%{transform:rotateY(180deg) translateY(-6%)}90%{transform:rotateY(0deg) translateY(0)}}

      @media (hover: hover) and (pointer: fine) {
        /* !important is load-bearing, not laziness: each letter's
           animation is declared INLINE in backdrop.jsx because the
           riffle's stagger is per-letter, and an inline declaration
           outranks a stylesheet rule. Without this the riffle keeps
           running underneath the fan, which is the exact thing the
           rule exists to stop. */
        /* Under the pointer the wave HOLDS where it is, so the fan
           reads, and picks up from the same place when the pointer
           leaves. It used to be removed (`animation-name: none`), which
           Chrome does not transition out of: a card mid-ripple snapped
           face on in one frame as the pointer arrived, and on the way
           out the wave restarted at its per-card delays and jumped cards
           up to 5px (review, 2026-09-17). Pausing the ripple instead
           could freeze a card showing its back, so the ripple runs on
           under the fan, a card turning in the open hand. */
        .scraps-title:hover .wm-wave { animation-play-state: paused !important; }
        /* Half the old angles since 2026-09-17: the cards already rest
           on a fanned curve (.wm-arc), so the hover opens the hand a
           little further rather than doubling its lean. */
        .scraps-title:hover .scraps-letter:nth-child(1) .scraps-kinetic { transform: rotate(-6.5deg) translateY(.015em); }
        .scraps-title:hover .scraps-letter:nth-child(2) .scraps-kinetic { transform: rotate(-4deg)  translateY(.006em); }
        .scraps-title:hover .scraps-letter:nth-child(3) .scraps-kinetic { transform: rotate(-1.5deg); }
        .scraps-title:hover .scraps-letter:nth-child(4) .scraps-kinetic { transform: rotate(1.5deg); }
        .scraps-title:hover .scraps-letter:nth-child(5) .scraps-kinetic { transform: rotate(4deg)  translateY(.006em); }
        .scraps-title:hover .scraps-letter:nth-child(6) .scraps-kinetic { transform: rotate(6.5deg) translateY(.015em); }
        .scraps-letter:hover .scraps-kinetic {
          transform: rotate(0deg) translateY(-.09em) scale(1.1) !important;
        }
      }

      /* ========================================================
         REDUCED MOTION — the full pass (Session 5, 2026-08-27).
         This replaces the five scoped rules that used to sit here
         with a note saying a real pass was still owed.

         Every animation in this project falls into one of three
         groups, and only the third needs thought:

         1. ONE-SHOT ENTRANCES that end where the element already
            belongs — fadeUp, cardFadeIn, slideUp/Down, popIn,
            letterAppear, panelDeal, cardEdgeFlip, errRise, the badge
            pop, and every entrance the interstitials run (slapDown,
            dealOn, ribbonFlip, the score roll, the sweep). Collapsing
            the duration lands the final frame immediately. Nothing
            is lost: these animate an element INTO the state it would
            have had anyway.
         2. PERPETUAL DECORATION that carries no state — the three
            swirl layers, the wordmark's wave and ripple, the ROUND
            sign's cycle, the match screen's wobble and pulse,
            the storyboard lean. Freezing them
            loses nothing at all.
         3. MOTION THAT IS THE ONLY CARRIER OF A STATE — three cases,
            and this is where a blanket `animation: none` would
            quietly break the game rather than calm it. A wiggling
            card means "this one is live"; a pulsing zone means
            "act here"; a shaking REVEAL button means "working".
            Remove the movement and a reduced-motion player loses
            information a default player has. Each gets a STATIC
            substitute below, keyed on a `live-cue-*` class the
            component adds alongside the animation.

         The blanket rule uses 1ms rather than `none` on purpose:
         `animation: none` discards a fill, so anything filling
         `forwards`/`both` (cardFadeIn, panelDeal, the delayed
         subtitle) would snap back to its unstyled start and stay
         there — invisible. A 1ms run still fills.

         Card FLIGHT is handled separately and already was: the
         motion hook in flight.jsx checks the same query and lands
         every card instantly instead of arcing it.
         ======================================================== */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          transition-delay: 0ms !important;
          scroll-behavior: auto !important;
        }

        /* Group 3 substitutes. Each says the same thing the motion
           said, without moving: a bright ring for "this card is live",
           a heavier zone ring for "act here", a thick collar on the
           REVEAL button for "working, wait".
           A ring, not an outline: `outline` belongs to :focus-visible
           alone, so a state cue and a focus ring can never be mistaken
           for one another on the same card. */
        .live-cue-card {
          border-radius: 14px;
          box-shadow: 0 0 0 3px var(--voltage),
                      0 0 0 7px color-mix(in srgb, var(--voltage) 30%, transparent) !important;
        }
        /* "Act here", standing still. This used to be a 5px ring,
           which was the right answer while a Scraps pile was a
           bordered panel and is the wrong one now: around a boxless
           heap it draws a rectangle in empty space. Same fix as the
           animated version — a stacked drop-shadow on the wrapper,
           which traces the cards' own torn outlines.
           Deliberately HEAVIER than the animation's brightest frame,
           not equal to it. A static substitute has to read as
           unambiguously ON; matched to the peak it would be mistaken
           for the resting frame of a pulse that is not running. */
        .live-cue-zone {
          filter: drop-shadow(0 0 2px var(--glow))
                  drop-shadow(0 0 5px var(--glow))
                  drop-shadow(0 0 15px color-mix(in srgb, var(--glow) 70%, transparent)) !important;
          animation: none !important;
        }
        /* A card still has to ARRIVE in the pile. Both halves of the
           re-sort collapse to one 0.28s fade onto the identical
           resting frame: the state change keeps a signal, and nothing
           travels. The duration needs !important to outrank the
           blanket 1ms rule above, which would otherwise take the
           substitute out along with the motion it substitutes for. */
        .scrap-settle {
          animation: scrapArrive 0.28s ease !important;
          animation-duration: 0.28s !important;
        }
        .live-cue-busy {
          box-shadow: 0 0 0 5px var(--slate) !important;
        }
        /* The interstitials (interstitials.jsx). Three of the stage's
           beats carry meaning in their motion and get a still version:
           the waving score simply sits in its colour instead of lifting
           (no glow, as with the motion; Stan, 2026-09-18); a
           title, a verdict or a sign fades onto its frame rather than
           appearing at once (the same 0.28s the pile uses, and the
           same !important to outrank the blanket rule); the letter
           cards are already turned. The slap-down, the sweep and the
           deal-on collapse to their final frame under the blanket
           rule, which is the cleared table with the words already on
           it — exactly the still the bench showed for each. */
        /* The narrator's entrance after a deal: a plain fade onto its
           frame, the same 0.28s the pile and the stage use. */
        .narrator-in { animation: scrapArrive 0.28s ease !important; animation-duration: 0.28s !important; }
        /* The Throw. The dim still fades, over the same 0.28s; a fade is
           not travel. The glint and the jolt simply do not happen. */
        .attack-dim { transition-duration: 0.28s !important; transition-delay: 0s !important; }
        .card-glint { display: none !important; }
        .scrap-jolt { animation: none !important; }
        .stage-wave { animation: none !important; }
        .stage-fade { animation: scrapArrive 0.28s ease !important; animation-duration: 0.28s !important; }
        .stage-flip { animation-duration: 1ms !important; }
        /* The match screen's idle motion simply stops: the cards sit
           face up, the winner's number sits in its colour. */
        .letter-wobble, .letter-cycle, .score-pulse { animation: none !important; }
        /* The wordmark's wave and ripple and the ROUND sign's cycle are
           decoration that loops; they simply stop, cards face up. */
        .wm-wave, .wm-cycle, .sign-cycle { animation: none !important; }
      }
    </style>
  </head>

            draws three. Both piles cap at 7 cards.</li>
          <li>Aces are a weapon: attack with one to discard two cards from
            your opponent's Scraps. She can counter with an Ace of her own.</li>
