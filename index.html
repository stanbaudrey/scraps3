<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCRAPS — Two Hands. One Table. No Mercy.</title>
    <meta name="description" content="A card game of hidden hands, public scraps, and calculated betrayal." />
    <!-- Fonts loaded here in <head> so they're available before first paint -->
    <!-- This eliminates hover lag caused by @import inside React style tags -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Fjalla+One&family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* ========================================================
         SINGLE SOURCE OF TRUTH for global CSS.
         Everything here loads before first paint, so hover
         classes, keyframes, and the reset are available on
         every screen (splash, difficulty, game) with no
         JS-injected styles and no per-component <style> tags.

         Color values are declared ONCE below, as CSS custom
         properties, and must match src/styles/theme.js's DS
         object exactly — that's the JS-side source of truth,
         this is the CSS-side source of truth. Two files, not
         four: plain CSS here can't import a JS module and still
         be ready before first paint, so this block is the whole
         reason a second declaration exists. Every rule after it
         uses var()/color-mix() instead of repeating a hex value.
         ======================================================== */
      :root {
        --voltage: #A3D85A;
        --slate: #A7B0A1;
        --frost: #EDE3D0;
        --dusk: #141F19;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--dusk); overflow-x: hidden; }
      /* Wider, higher-contrast scrollbar than the original 5px/27% —
         a clipped/overflowing panel needs a visible cue that more
         content is reachable, not just a hidden native scrollbar. */
      * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--slate) 55%, transparent) transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--slate) 55%, transparent); border-radius: 4px; }

      /* Global hover classes — defined here so they work before React hydrates */
      .menu-opt {
        cursor: pointer;
        border: 2px solid color-mix(in srgb, var(--slate) 27%, transparent);
        border-radius: 10px;
        padding: 20px 24px;
        background: transparent;
        transition: border-color 80ms, background 80ms, box-shadow 80ms;
      }
      .menu-opt:hover {
        border-color: var(--voltage);
        background: color-mix(in srgb, var(--voltage) 8%, transparent);
        box-shadow: 0 0 20px color-mix(in srgb, var(--voltage) 40%, transparent);
      }
      .diff-opt {
        cursor: pointer;
        border: 2px solid color-mix(in srgb, var(--slate) 27%, transparent);
        border-radius: 10px;
        padding: 18px 22px;
        background: transparent;
        transition: border-color 80ms, background 80ms, box-shadow 80ms;
      }
      .diff-opt:hover {
        border-color: var(--voltage);
        background: color-mix(in srgb, var(--voltage) 8%, transparent);
        box-shadow: 0 0 20px color-mix(in srgb, var(--voltage) 40%, transparent);
      }

      /* Difficulty picker — the two big boxes. They unfold from a
         hairline and are INERT until .armed lands (see ARM_MS in
         MenuScreens.jsx): pointer-events off, muted border, so a
         click-streak carried over from the storyboard can't pick a
         difficulty by accident. .armed is the visual "now listening"
         cue — border snaps to voltage and the box pulses once. */
      .pick-box {
        border: 2px solid color-mix(in srgb, var(--slate) 27%, transparent);
        border-radius: 14px;
        padding: 26px 30px;
        background: color-mix(in srgb, var(--dusk) 90%, var(--slate));
        cursor: default;
        pointer-events: none;
        animation: panelUnfold 420ms cubic-bezier(.22,1,.36,1) both;
        transition: border-color 140ms, background 140ms, box-shadow 140ms, transform 140ms;
      }
      .pick-box.armed {
        cursor: pointer;
        pointer-events: auto;
        border-color: color-mix(in srgb, var(--voltage) 70%, transparent);
        animation: panelUnfold 420ms cubic-bezier(.22,1,.36,1) both, armFlash 620ms ease-out;
      }
      .pick-box.armed:hover {
        border-color: var(--voltage);
        background: color-mix(in srgb, var(--voltage) 10%, transparent);
        box-shadow: 0 0 26px color-mix(in srgb, var(--voltage) 45%, transparent);
        transform: scale(1.015);
      }

      /* Storyboard walkthrough — the ONLY motion on those screens.
         A slow lean applied to a wrapper, never to the card itself,
         so PlayingCard's own transform/transition stays untouched
         and the reduced-motion rule below has one thing to switch
         off. Per-element animation-delay is set inline. */
      .wt-wiggle {
        animation: wtWiggle 1.1s ease-in-out infinite alternate;
        transform-origin: 50% 88%;
      }

      /* Shared keyframes — used across splash, game screen, and overlays */
      @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
      @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes zonePulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb, var(--voltage) 27%, transparent),0 0 16px color-mix(in srgb, var(--voltage) 20%, transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--voltage) 60%, transparent),0 0 30px color-mix(in srgb, var(--voltage) 40%, transparent)}}
      @keyframes fullScrapPop{from{opacity:0;transform:scale(.3) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes cardWiggle{0%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(4deg) scale(1.06)}}
      @keyframes waveUp{0%{transform:translateY(0)}40%{transform:translateY(-22px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
      @keyframes cardFadeIn{0%{opacity:0.1;transform:translateY(-12px) scale(0.92)}60%{opacity:0.9}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.5)}70%{transform:scale(0.95)}100%{transform:scale(1)}}
      @keyframes roundEndScorePop{0%{transform:scale(1) rotate(0deg)}22%{transform:scale(1.9) rotate(-4deg)}42%{transform:scale(1.9) rotate(4deg)}62%{transform:scale(1.85) rotate(-3deg)}85%{transform:scale(1.15) rotate(0deg)}100%{transform:scale(1) rotate(0deg)}}
      @keyframes badgeFlash{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(0.97)}100%{transform:scale(1)}}
      @keyframes cardShake{0%{transform:translateX(-4px) rotate(-2deg)}50%{transform:translateX(4px) rotate(2deg)}100%{transform:translateX(-4px) rotate(-2deg)}}
      @keyframes slideDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
      @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
      @keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
      @keyframes letterAppear{from{opacity:0;transform:translateY(44px) scale(.65) rotate(-4deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}}
      @keyframes letterBounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}65%{transform:translateY(-4px)}}
      @keyframes suitsBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @keyframes wtWiggle{0%{transform:rotate(-2.2deg) translateY(0)}100%{transform:rotate(2.2deg) translateY(-5px)}}
      @keyframes panelUnfold{0%{opacity:0;clip-path:inset(48% 0 48% 0);transform:scaleY(.82)}55%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);transform:scaleY(1)}}
      @keyframes armFlash{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 0 4px color-mix(in srgb, var(--voltage) 42%, transparent),0 0 30px color-mix(in srgb, var(--voltage) 34%, transparent)}100%{box-shadow:0 0 0 0 transparent}}
      /* Over-limit trade error — quick attention bounce */
      @keyframes errBounce{0%{transform:translateY(0) scale(1)}20%{transform:translateY(-12px) scale(1.05)}45%{transform:translateY(0) scale(1)}65%{transform:translateY(-5px)}100%{transform:translateY(0)}}
      /* SwirlBg flowing color swaths — opacity + transform only, compositor-safe */
      @keyframes swirlFlowA{0%,100%{opacity:.55;transform:translate(0,0) scale(1)}50%{opacity:.9;transform:translate(3%,-2%) scale(1.1)}}
      @keyframes swirlFlowB{0%,100%{opacity:.5;transform:translate(0,0) scale(1)}50%{opacity:.85;transform:translate(-2%,3%) scale(1.08)}}
      @keyframes swirlFlowC{0%,100%{opacity:.45;transform:translate(0,0) scale(1)}50%{opacity:.8;transform:translate(2%,2%) scale(1.06)}}

      /* ========================================================
         SCRAPS wordmark — three nested layers per letter, because
         three separate things want to own `transform` at once and
         the last animation to run would otherwise win:
           .scraps-letter   entrance + the perpetual breathe
           .scraps-kinetic  desktop hover ripple (transition only)
           .t3d             the mobile 3D flip (its own 3D context)
         Perspective sits on .scraps-kinetic, the direct parent of
         the flip box: an ancestor with its own transform flattens
         perspective inherited from further up, so putting it on the
         row would silently do nothing.
         ======================================================== */
      .scraps-title { display: flex; justify-content: center; gap: 4px; }
      .scraps-letter {
        display: inline-block;
        transition: padding 380ms cubic-bezier(.2,.8,.3,1);
        will-change: transform;
        /* Six one-letter boxes, each with a second face carrying the same
           glyph: selecting the wordmark would otherwise hand over
           "SSCCRRAAPPSS". aria-hidden fixes the a11y tree but not the text
           layer, so the back face's glyph moved into ::after (below) and
           selection is off here. */
        user-select: none;
      }
      .scraps-kinetic {
        display: inline-block;
        /* Relative to the letter, not a fixed px: depth is 0.5em, so a fixed
           900px made the barrel roll a 3% ratio at the 54px mobile wordmark
           against 8% on desktop — it read as a vertical squash on exactly
           the devices the flip was built for. */
        perspective: 5em;
        transition: transform 380ms cubic-bezier(.2,.8,.3,1),
                    filter 380ms ease;
      }
      /* Gentle rise and fall, one letter after another. Deliberately
         has NO fill mode: it is listed alongside the entrance
         animation, and with no fill it stays inert until its delay
         elapses, letting letterAppear own the transform first. */
      @keyframes titleBreathe {
        0%,100% { transform: translateY(0) scale(1); }
        50%     { transform: translateY(-9px) scale(1.035); }
      }

      /* Kinetic hover, desktop only. Magic UI's version interpolates
         font-weight; the wordmark face (Bungee Shade) ships a single
         weight, so weight would be a no-op. The behaviour that makes
         the effect read — one letter swells, its neighbours give way
         by a decreasing amount — is carried here by scale + the
         inline padding push instead. */
      @media (hover: hover) and (pointer: fine) {
        .scraps-letter:hover { padding-inline: .055em; }
        .scraps-letter:hover + .scraps-letter,
        .scraps-letter:has(+ .scraps-letter:hover) { padding-inline: .028em; }
        .scraps-letter:hover > .scraps-kinetic {
          transform: scale(1.2) translateY(-8px);
          filter: drop-shadow(0 6px 14px rgba(0,0,0,.45));
        }
        .scraps-letter:hover + .scraps-letter > .scraps-kinetic,
        .scraps-letter:has(+ .scraps-letter:hover) > .scraps-kinetic {
          transform: scale(1.1) translateY(-4px);
        }
        .scraps-letter:hover + .scraps-letter + .scraps-letter > .scraps-kinetic,
        .scraps-letter:has(+ .scraps-letter + .scraps-letter:hover) > .scraps-kinetic {
          transform: scale(1.04) translateY(-1px);
        }
      }

      /* 3D flip box. Both faces carry the same letter, so ending the
         animation at -90deg and snapping back to 0 is invisible —
         that is what lets one keyframe stand in for a full barrel
         roll. Depth is 0.5em, i.e. half the letter box, which is
         uniform across letters even though their widths are not. */
      .t3d { display: inline-block; position: relative; transform-style: preserve-3d; }
      .t3d-face { display: block; backface-visibility: hidden; }
      .t3d-front { transform: translateZ(0.5em); }
      .t3d-back { position: absolute; inset: 0; transform: rotateX(90deg) translateZ(0.5em); }
      .t3d-back::after { content: attr(data-char); }
      .t3d.flipping { animation: t3dFlip 560ms cubic-bezier(.3,.85,.35,1) both; }
      @keyframes t3dFlip {
        from { transform: translateZ(-0.5em) rotateX(0deg); }
        to   { transform: translateZ(-0.5em) rotateX(-90deg); }
      }

      /* Shine border. The Magic UI original slides `background-position`
         on a masked ring, but that is a paint property: two rings would
         repaint every frame, forever. backdrop.jsx's own header records
         that exact bug class causing real hover lag here before. So the
         mask stays static and a conic gradient ROTATES behind it —
         transform is compositor-only, and a rotating sweep actually
         travels around the border instead of pooling in the corners.
         Gold is deliberately absent: theme.js reserves it for milestones
         (Full Scrap, the win screen, your own Ace), never general UI. */
      .shiny { position: relative; }
      .shine-ring {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 2px;
        pointer-events: none;
        overflow: hidden;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
      }
      .shine-ring::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 190%;
        aspect-ratio: 1;
        background: conic-gradient(from 0turn,
          transparent 0turn,
          color-mix(in srgb, var(--voltage) 70%, transparent) 0.10turn,
          var(--frost) 0.15turn,
          color-mix(in srgb, var(--voltage) 70%, transparent) 0.20turn,
          transparent 0.30turn,
          transparent 1turn);
        animation: shineSpin 8s linear infinite;
        will-change: transform;
      }
      @keyframes shineSpin {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to   { transform: translate(-50%, -50%) rotate(360deg); }
      }

      /* Scoped, not global — a full reduced-motion pass over every
         animation in the game is Session 5's job. This only stops the
         one new perpetual decorative loop, which carries no state or
         feedback, so freezing it loses nothing. */
      @media (prefers-reduced-motion: reduce) {
        div[style*="swirlFlow"] { animation: none !important; }
        /* Both are decorative-only and carry no state: the storyboard
           wiggle is emphasis, the picker unfold is a reveal. Killing
           them leaves the final rendered state, and the picker's
           input lock is a JS timer, so it still arms on schedule. */
        .wt-wiggle { animation: none !important; }
        .pick-box, .pick-box.armed { animation: none !important; }
        .shine-ring { display: none !important; }
        /* Kills the wordmark's entrance and its breathe together.
           Safe: letterAppear only fills in opacity/transform it
           already returns to, so with no animation the letters just
           render settled. */
        .scraps-letter, .t3d.flipping { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
