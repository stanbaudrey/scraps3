    <title>SCRAPS — Two Hands. One Table. No Mercy.</title>
    <meta name="description" content="A card game of hidden hands, public scraps, and calculated betrayal." />
    <!-- Fonts are SELF-HOSTED from /fonts (Session 6). They used to come from
         fonts.googleapis.com + fonts.gstatic.com, which handed every visitor's
         IP and user-agent to a third party before the game had drawn a card.
         Nothing here reaches off-origin any more.

         The @font-face rules live in the <style> block below rather than a
         separate stylesheet, for the same reason everything else does: they
         must be parsed before first paint. Regenerate them, and the files in
         public/fonts, with `npm run fonts` — never edit either by hand.

         Only the splash's three families are preloaded; Baloo 2 (card faces)
         and IBM Plex Mono are not on the first screen and are left to be
         fetched when they are first used. crossorigin is required on a font
         preload even same-origin, or the browser fetches the file twice. -->

      /* ========================================================
         SINGLE SOURCE OF TRUTH for global CSS.
         Everything here loads before first paint, so hover
         classes, keyframes, and the reset are available on
         every screen (splash, difficulty, game) with no
         JS-injected styles and no per-component <style> tags.

         Color values are declared ONCE below, as CSS custom
         properties, and must match src/styles/theme.js's DS
         object exactly — that's the JS-side source of truth,
         this is the CSS-side source of truth. Two files, not
         four: plain CSS here can't import a JS module and still
         be ready before first paint, so this block is the whole
         reason a second declaration exists. Every rule after it
         uses var()/color-mix() instead of repeating a hex value.
         ======================================================== */
      :root {
        --voltage: #A3D85A;
        --slate: #A7B0A1;
        --dusk: #141F19;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* The game fits the viewport, always — see src/ui/viewport.jsx.
         So the document itself never scrolls, and saying so here is
         what stops an iOS rubber-band bounce from making a fitted
         screen feel like a broken one. */
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { background: var(--dusk); }
      #root { height: 100%; }

      /* 100dvh where it exists, 100vh where it does not. Two
         declarations of the same property is the only way to write
         that fallback, which a React inline style object cannot do
         — hence a class. dvh matters on phones specifically: with
         vh, the layout is sized for a URL bar that has already
         scrolled away, and the bottom of the table goes with it. */
      .app-vh { height: 100vh; height: 100dvh; }
      .app-min-vh { min-height: 100vh; min-height: 100dvh; }

      /* No 300ms tap delay, no double-tap zoom on a control. Cards
         carry role=button, so they are covered too. Pinch zoom on
         the page is deliberately left alone. */
      button, [role="button"] { touch-action: manipulation; }
      /* Wider, higher-contrast scrollbar than the original 5px/27% —
         a clipped/overflowing panel needs a visible cue that more
         content is reachable, not just a hidden native scrollbar. */
      * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--slate) 55%, transparent) transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--slate) 55%, transparent); border-radius: 4px; }

      /* Keyboard focus. Every button in this project set
         `outline:'none'` with no replacement, so a keyboard user had no
         idea where they were. :focus-visible (not :focus) means a mouse
         click never paints a ring — only keyboard navigation does, which
         is why the outline can be this loud without ever being in a
         mouse user's way. Voltage is already the "interactive/yours"
         token, so the ring says the same thing as everything else. */
      :focus-visible {
        outline: 3px solid var(--voltage);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* Available to a screen reader, absent from the picture. Used for
         the per-screen <h1>s and for the two live regions that narrate
         the game — see GameAnnouncer in hud.jsx. `clip-path` rather than
         `display:none` or `visibility:hidden`, because both of those
         remove the node from the accessibility tree as well, which would
         defeat the entire point of a live region. */
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* The wordmark is the page's <h1>. Reset what a UA gives an h1 so
         the heading is a semantic change and not a visual one. */
      h1.scraps-title { margin: 0; font-size: inherit; font-weight: inherit; }

      /* `.menu-opt` and `.diff-opt` lived here until 2026-08-27. Both were
         dead: the splash's option wall was deleted with the RULES panel,
         and the difficulty picker became a real <button> styled by
         `.pick-box` below. Nothing in src/ referenced either class. */

      /* Difficulty picker — the two big boxes. They unfold from a
         hairline and are INERT until .armed lands (see ARM_MS in
         MenuScreens.jsx): pointer-events off, muted border, so a
         click-streak carried over from the storyboard can't pick a
         difficulty by accident. .armed is the visual "now listening"
         cue — border snaps to voltage and the box pulses once. */
      .pick-box {
        /* A real <button> now, not a div, so the UA's own font, colour,
           centring and width have to be unset for the panel to look
           exactly as it did. */
        min-height: 44px;
        appearance: none;
        -webkit-appearance: none;
        font: inherit;
        color: inherit;
        text-align: left;
        width: 100%;
        display: block;
        border: 2px solid color-mix(in srgb, var(--slate) 27%, transparent);
        border-radius: 14px;
        padding: 26px 30px;
        background: color-mix(in srgb, var(--dusk) 90%, var(--slate));
        cursor: default;
        pointer-events: none;
        animation: panelDeal 620ms cubic-bezier(.2,.9,.3,1) backwards;
        transition: border-color 140ms, background 140ms, box-shadow 140ms, transform 140ms;
      }
      .pick-box.armed {
        cursor: pointer;
        pointer-events: auto;
        border-color: color-mix(in srgb, var(--accent, var(--voltage)) 70%, transparent);
        animation: panelDeal 620ms cubic-bezier(.2,.9,.3,1) backwards, armFlash 620ms ease-out;
      }
      /* --accent is set per box from theme.js (voltage for EASY, ember
         for HARD) so the two options differ by more than their words.
         Falls back to voltage, which is what every other .pick-box in
         the project would want. */
      @media (hover: hover) and (pointer: fine) {
        .pick-box.armed:hover {
          border-color: var(--accent, var(--voltage));
          background: color-mix(in srgb, var(--accent, var(--voltage)) 10%, transparent);
          box-shadow: 0 0 26px color-mix(in srgb, var(--accent, var(--voltage)) 45%, transparent);
          transform: scale(1.015);
        }
      }
      /* Touch gets the same answer, on the press instead of the
         hover. It is the louder half of the hover rule deliberately:
         a finger covers the box it is pressing, so the cue has to
         survive being partly hidden. */
      .pick-box.armed:active {
        border-color: var(--accent, var(--voltage));
        background: color-mix(in srgb, var(--accent, var(--voltage)) 16%, transparent);
        box-shadow: 0 0 26px color-mix(in srgb, var(--accent, var(--voltage)) 45%, transparent);
        transform: scale(0.985);
      }

      /* Storyboard walkthrough — the ONLY motion on those screens.
         A slow lean applied to a wrapper, never to the card itself,
         so PlayingCard's own transform/transition stays untouched
         and the reduced-motion rule below has one thing to switch
         off. Per-element animation-delay is set inline. */
      .wt-wiggle {
        animation: wtWiggle 1.1s ease-in-out infinite alternate;
        transform-origin: 50% 88%;
      }

      /* Shared keyframes — used across splash, game screen, and overlays */
      @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
      @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes zonePulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb, var(--voltage) 27%, transparent),0 0 16px color-mix(in srgb, var(--voltage) 20%, transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--voltage) 60%, transparent),0 0 30px color-mix(in srgb, var(--voltage) 40%, transparent)}}
      @keyframes fullScrapPop{from{opacity:0;transform:scale(.3) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes cardWiggle{0%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(4deg) scale(1.06)}}
      @keyframes waveUp{0%{transform:translateY(0)}40%{transform:translateY(-22px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
      @keyframes cardFadeIn{0%{opacity:0.1;transform:translateY(-12px) scale(0.92)}60%{opacity:0.9}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.5)}70%{transform:scale(0.95)}100%{transform:scale(1)}}
      @keyframes roundEndScorePop{0%{transform:scale(1) rotate(0deg)}22%{transform:scale(1.9) rotate(-4deg)}42%{transform:scale(1.9) rotate(4deg)}62%{transform:scale(1.85) rotate(-3deg)}85%{transform:scale(1.15) rotate(0deg)}100%{transform:scale(1) rotate(0deg)}}
      @keyframes badgeFlash{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(0.97)}100%{transform:scale(1)}}
      @keyframes cardShake{0%{transform:translateX(-4px) rotate(-2deg)}50%{transform:translateX(4px) rotate(2deg)}100%{transform:translateX(-4px) rotate(-2deg)}}
      @keyframes slideDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
      @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
      @keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
      @keyframes letterAppear{from{opacity:0;transform:translateY(44px) scale(.65) rotate(-4deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}}
      @keyframes letterBounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}65%{transform:translateY(-4px)}}
      @keyframes suitsBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @keyframes wtWiggle{0%{transform:rotate(-2.2deg) translateY(0)}100%{transform:rotate(2.2deg) translateY(-5px)}}
      /* Dealt in — the panel is placed on the table like a card, from
         off the left, once. Fill is `backwards`, NOT `both`, and that
         is load-bearing: the old panelUnfold filled a transform
         forwards, and a filling animation outranks author rules, so
         .pick-box.armed:hover's lift never rendered. Ending unfilled
         hands `transform` back to the hover rule. */
      @keyframes panelDeal{
        0%{opacity:0;transform:translate(-46%,-24%) rotate(-11deg)}
        45%{opacity:1}
        100%{opacity:1;transform:translate(0,0) rotate(0deg)}
      }
      @keyframes armFlash{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 0 4px color-mix(in srgb, var(--accent, var(--voltage)) 42%, transparent),0 0 30px color-mix(in srgb, var(--accent, var(--voltage)) 34%, transparent)}100%{box-shadow:0 0 0 0 transparent}}
      /* Over-limit trade error. `errBounce` is retired: it overshot
         12px and then again at 5px, which is a celebration curve
         attached to the message that your move is illegal — the
         detector's bounce-easing finding, restated in game terms.
         errRise arrives once and settles. */
      @keyframes errRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
      /* SwirlBg flowing color swaths — opacity + transform only, compositor-safe */
      @keyframes swirlFlowA{0%,100%{opacity:.55;transform:translate(0,0) scale(1)}50%{opacity:.9;transform:translate(3%,-2%) scale(1.1)}}
      @keyframes swirlFlowB{0%,100%{opacity:.5;transform:translate(0,0) scale(1)}50%{opacity:.85;transform:translate(-2%,3%) scale(1.08)}}
      @keyframes swirlFlowC{0%,100%{opacity:.45;transform:translate(0,0) scale(1)}50%{opacity:.8;transform:translate(2%,2%) scale(1.06)}}

      /* ========================================================
         SCRAPS wordmark — three nested layers per letter, because
         three separate things want to own `transform` at once and
         the last animation to run would otherwise win:
           .scraps-letter   entrance + the perpetual riffle
           .scraps-kinetic  desktop hover fan (transition only)
           .tap-layer       the touch-device square-up
         Perspective sits on the row: the riffle rotates each letter
         about its own X axis, and without a 3D context that read as
         a flat vertical squash.
         ======================================================== */
      .scraps-title {
        display: flex;
        justify-content: center;
        gap: 4px;
        perspective: 26em;
        /* The wordmark answers hover and (on touch) tap, but clicking
           it does nothing on a pointer device — so it must not claim
           to be a control. Cursor stays default deliberately. */
        cursor: default;
      }
      .scraps-letter {
        display: inline-block;
        will-change: transform;
        user-select: none;
        /* Carries the letter home when the riffle is removed on hover.
           Per the transitions spec the before-change style includes a
           running animation's effect, so dropping titleRiffle mid-pass
           transitions out of the tilt rather than snapping out of it. */
        transition: transform 260ms cubic-bezier(.2,.8,.3,1);
      }
      .scraps-kinetic {
        display: inline-block;
        transform-origin: 50% 128%;
        transition: transform 420ms cubic-bezier(.2,.8,.3,1);
      }
      .tap-layer { display: inline-block; }

      /* Riffle — a spring travelling the row the way a bridged deck
         releases: most of the cycle is stillness, then a fast pass.
         2.08s rather than the 2.6s of the first pass, a quarter more
         often, per Stan.
         Deliberately NO fill mode: it shares the `animation` shorthand
         with the letterAppear entrance, and with no fill it stays
         inert until its delay elapses, letting the entrance own the
         transform first. */
      @keyframes titleRiffle {
        0%, 62%, 100% { transform: translateY(0) rotateX(0deg) scaleY(1); }
        68%  { transform: translateY(-0.09em) rotateX(-58deg) scaleY(1.16); }
        74%  { transform: translateY(0.015em) rotateX(16deg) scaleY(.93); }
        80%  { transform: translateY(0) rotateX(0deg) scaleY(1); }
      }

      /* Fan — the row splays like a hand opening, and the letter under
         the cursor stands upright out of the fan. Pure transform: an
         earlier version of this hover animated inline padding to push
         neighbours apart, which is a layout property and reflowed the
         row every frame. Rotation off a pivot below the baseline gets
         the same "giving way" read for free. */
      @media (hover: hover) and (pointer: fine) {
        /* !important is load-bearing, not laziness: each letter's
           animation is declared INLINE in backdrop.jsx because the
           riffle's stagger is per-letter, and an inline declaration
           outranks a stylesheet rule. Without this the riffle keeps
           running underneath the fan, which is the exact thing the
           rule exists to stop. */
        .scraps-title:hover .scraps-letter { animation-name: letterAppear, none !important; }
        .scraps-title:hover .scraps-letter:nth-child(1) .scraps-kinetic { transform: rotate(-13deg) translateY(.03em); }
        .scraps-title:hover .scraps-letter:nth-child(2) .scraps-kinetic { transform: rotate(-8deg)  translateY(.012em); }
        .scraps-title:hover .scraps-letter:nth-child(3) .scraps-kinetic { transform: rotate(-3deg); }
        .scraps-title:hover .scraps-letter:nth-child(4) .scraps-kinetic { transform: rotate(3deg); }
        .scraps-title:hover .scraps-letter:nth-child(5) .scraps-kinetic { transform: rotate(8deg)  translateY(.012em); }
        .scraps-title:hover .scraps-letter:nth-child(6) .scraps-kinetic { transform: rotate(13deg) translateY(.03em); }
        .scraps-letter:hover .scraps-kinetic {
          transform: rotate(0deg) translateY(-.09em) scale(1.1) !important;
        }
      }

      /* Square-up — the letters go loose like an untidy hand, then snap
         flush as if tapped on the table. Offsets are fixed per letter
         rather than random so the gesture is identical every time; a
         motion that differs run to run reads as a glitch. Paired with
         playSquareUp() in audio.js, which runs to the same length. */
      @keyframes squareUp {
        0%   { transform: translate(0,0) rotate(0deg); }
        22%  { transform: translate(var(--dx), var(--dy)) rotate(var(--dr)); }
        100% { transform: translate(0,0) rotate(0deg); }
      }
      .tap-layer.squaring {
        animation: squareUp 720ms cubic-bezier(.25,1.2,.4,1) both;
      }

      /* ========================================================
         REDUCED MOTION — the full pass (Session 5, 2026-08-27).
         This replaces the five scoped rules that used to sit here
         with a note saying a real pass was still owed.

         Every animation in this project falls into one of three
         groups, and only the third needs thought:

         1. ONE-SHOT ENTRANCES that end where the element already
            belongs — fadeUp, cardFadeIn, slideUp/Down, popIn,
            fullScrapPop, letterAppear, panelDeal, waveUp, errRise,
            the score and badge pops. Collapsing the duration lands
            the final frame immediately. Nothing is lost: these
            animate an element INTO the state it would have had
            anyway.
         2. PERPETUAL DECORATION that carries no state — the three
            swirl layers, the wordmark riffle and its tap scatter,
            the storyboard lean, the suits bounce. Freezing them
            loses nothing at all.
         3. MOTION THAT IS THE ONLY CARRIER OF A STATE — three cases,
            and this is where a blanket `animation: none` would
            quietly break the game rather than calm it. A wiggling
            card means "this one is live"; a pulsing zone means
            "act here"; a shaking REVEAL button means "working".
            Remove the movement and a reduced-motion player loses
            information a default player has. Each gets a STATIC
            substitute below, keyed on a `live-cue-*` class the
            component adds alongside the animation.

         The blanket rule uses 1ms rather than `none` on purpose:
         `animation: none` discards a fill, so anything filling
         `forwards`/`both` (cardFadeIn, panelDeal, the delayed
         subtitle) would snap back to its unstyled start and stay
         there — invisible. A 1ms run still fills.

         Card FLIGHT is handled separately and already was: the
         motion hook in flight.jsx checks the same query and lands
         every card instantly instead of arcing it.
         ======================================================== */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          transition-delay: 0ms !important;
          scroll-behavior: auto !important;
        }

        /* Group 3 substitutes. Each says the same thing the motion
           said, without moving: a bright ring for "this card is live",
           a heavier zone ring for "act here", a thick collar on the
           REVEAL button for "working, wait".
           A ring, not an outline: `outline` belongs to :focus-visible
           alone, so a state cue and a focus ring can never be mistaken
           for one another on the same card. */
        .live-cue-card {
          border-radius: 14px;
          box-shadow: 0 0 0 3px var(--voltage),
                      0 0 0 7px color-mix(in srgb, var(--voltage) 30%, transparent) !important;
        }
        .live-cue-zone {
          box-shadow: 0 0 0 5px color-mix(in srgb, var(--voltage) 75%, transparent) !important;
        }
        .live-cue-busy {
          box-shadow: 0 0 0 5px var(--slate) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
